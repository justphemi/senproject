<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Profiles{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f4f5f7;
    color: #1f2328;
    line-height: 1.5;
  }
  .nav {
    background: #fff;
    border-bottom: 1px solid #d0d7de;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .nav a.brand {
    font-weight: 600;
    font-size: 18px;
    color: #1f2328;
    text-decoration: none;
  }
  .container {
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    padding: 28px;
  }
  h1 { margin: 0 0 18px 0; font-size: 22px; }
  h2 { margin: 0 0 12px 0; font-size: 18px; }
  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  input[type="text"], textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: #0969da;
    box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
  }
  .field { margin-bottom: 16px; }
  .help { font-size: 12px; color: #57606a; margin-top: 4px; }
  .errors { color: #b91c1c; font-size: 13px; margin-top: 6px; }
  .btn {
    display: inline-block;
    padding: 9px 16px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: #f6f8fa;
    color: #1f2328;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { background: #eef1f4; }
  .btn.primary { background: #1f883d; border-color: #1f883d; color: #fff; }
  .btn.primary:hover { background: #196e2f; }
  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid #d0d7de;
    background: #eaeef2;
  }
  .avatar.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #57606a;
    font-size: 40px;
  }
  .avatar-lg { width: 140px; height: 140px; }
  .profile-head {
    display: flex;
    gap: 22px;
    align-items: center;
    margin-bottom: 20px;
  }
  .messages { margin-bottom: 18px; }
  .message {
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
    background: #ddf4ff;
    border: 1px solid #54aeff;
    color: #0969da;
    margin-bottom: 8px;
  }
  .bio { color: #1f2328; white-space: pre-wrap; }
  .meta { color: #57606a; font-size: 13px; margin-top: 8px; }
  .row-between { display: flex; justify-content: space-between; align-items: center; }
  .muted { color: #57606a; }
  .file-input { font-size: 14px; }
</style>
</head>
<body>
  <nav class="nav">
    <a class="brand" href="{% url 'home' %}">Profiles</a>
    <a class="btn" href="{% url 'home' %}">Home</a>
  </nav>
  <div class="container">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="message">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
